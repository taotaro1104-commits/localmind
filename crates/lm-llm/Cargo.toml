[package]
name = "lm-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# llama.cpp 本体（ネイティブのビルドに cmake が要る）。無くても、プロンプト・文法・出力の解析は使える。
llama = ["dep:llama-cpp-2"]

[dependencies]
lm-ingest = { path = "../lm-ingest" }
sha2.workspace = true
serde_json = "1"
llama-cpp-2 = { version = "=0.1.161", default-features = false, optional = true }
