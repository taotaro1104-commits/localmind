[workspace]
resolver = "2"
members = ["crates/lm-scheduler", "crates/lm-router", "crates/lm-search", "crates/lm-ingest", "crates/lm-ffi", "crates/lm-workspace", "crates/lm-whisper", "crates/lm-llm", "crates/lm-llm-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
thiserror = "2"
lindera = { version = "6", default-features = false, features = ["embed-ipadic"] }
rusqlite = { version = "0.41", features = ["bundled"] }
sqlite-vec = "=0.1.9"
fastembed = { version = "7.5", default-features = false, features = ["onnx"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
sha2 = "0.11"
uniffi = "0.32"

[profile.release]
strip = true
# FFI 層は Rust のパニックを Kotlin の例外に変えるため unwind が前提。`abort` にしてはならない。
panic = "unwind"
